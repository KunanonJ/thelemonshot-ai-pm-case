name: CI/CD

# Pull requests run the checks. A push to main (a merged pull request) runs the same checks, then applies any
# new D1 migrations and deploys to production. "Run workflow" on main redeploys it without a new commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs because the deploy job holds a Cloudflare token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc -p tsconfig.worker.json --noEmit
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm build

  deploy:
    name: Deploy to production
    needs: check
    # Only main, never a pull request, and only after the checks pass
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://lemonshot.kunanonj.com
    # One deploy at a time: a newer push waits rather than cancelling a deploy halfway through
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs before the build on purpose: the build points Wrangler at its generated config. In CI, Wrangler
      # answers its own "continue?" prompt with yes.
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
      # The tag records which commit is live (wrangler deployments list, or the dashboard)
      - name: Build and deploy
        run: |
          pnpm build
          pnpm exec wrangler deploy --tag "${GITHUB_SHA::7}" --message "GitHub Actions run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA::7}"
      - name: Check the live site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://lemonshot.kunanonj.com/health
