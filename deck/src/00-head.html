<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win. Match. Optimize. | The Lemon Shot · AI Product Manager case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME: change these to restyle the whole deck
   ============================================================ */
:root {
  --bg: #0e0f0b;
  --panel: #171913;
  --panel-2: #1f2219;
  --line: #2b2f23;
  --line-2: #3d4232;
  --text: #f3f1e7;
  --muted: #b0b3a3;
  --faint: #73776a;
  --lemon: #f4e04d;
  --lemon-ink: #191a0f;
  --lemon-soft: rgba(244, 224, 77, 0.11);
  --lime: #a6e35a;
  --orange: #ff8f4d;
  --orange-soft: rgba(255, 143, 77, 0.12);
  --sky: #7cc4ff;
  --sky-soft: rgba(124, 196, 255, 0.11);
  --display: 'Space Grotesk', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --radius: 14px;
  --scale: 1;
}

/* ============================================================
   STAGE: every slide is a fixed 1280x720 canvas scaled to fit
   the viewport, so nothing ever scrolls or reflows.
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--display); -webkit-font-smoothing: antialiased; }
.deck { position: fixed; inset: 0; }
.slide {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px;
  transform: translate(-50%, -50%) scale(var(--scale));
  overflow: hidden; background: var(--bg);
  padding: 42px 56px 44px;
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility .35s;
}
.slide.active { opacity: 1; visibility: visible; }
.slide::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(620px 320px at 100% 0%, rgba(244, 224, 77, .07), transparent 70%),
    radial-gradient(520px 280px at 0% 100%, rgba(124, 196, 255, .05), transparent 70%);
}
.slide > * { position: relative; }

/* ============================================================
   TYPE + COMMON COMPONENTS
   ============================================================ */
.kicker { font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--lemon); margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.kicker::before { content: ''; width: 18px; height: 2px; background: var(--lemon); }
h2.t { font-size: 33px; line-height: 1.12; font-weight: 700; letter-spacing: -0.015em; max-width: 1120px; }
.lede { font-size: 15.5px; color: var(--muted); margin-top: 8px; max-width: 1040px; line-height: 1.45; }
.body { flex: 1; min-height: 0; margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
.foot { position: absolute; left: 56px; right: 56px; bottom: 15px; display: flex; justify-content: space-between; gap: 20px; font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.foot span:nth-child(2) { flex: 1; text-align: center; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.card.hl { border-color: rgba(244, 224, 77, .45); background: linear-gradient(180deg, rgba(244, 224, 77, .08), var(--panel) 62%); }
.card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; color: var(--text); }
.card p, .card li { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.card ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.card li { padding-left: 14px; position: relative; }
.card li::before { content: ''; position: absolute; left: 0; top: .66em; width: 6px; height: 2px; background: var(--lemon); }
.card b, .callout b, .tbl b { color: var(--text); font-weight: 600; }
.lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lemon); margin-bottom: 8px; }
.lab.s { color: var(--sky); } .lab.o { color: var(--orange); } .lab.m { color: var(--faint); }
.lemon { color: var(--lemon); }
.mono { font-family: var(--mono); }
.tag { display: inline-block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.tag.y { background: var(--lemon); color: var(--lemon-ink); border-color: var(--lemon); font-weight: 600; }
.tag.o { border-color: rgba(255, 143, 77, .5); color: var(--orange); background: var(--orange-soft); }
.tag.s { border-color: rgba(124, 196, 255, .45); color: var(--sky); background: var(--sky-soft); }
.callout { border-left: 3px solid var(--lemon); padding: 11px 16px; background: var(--lemon-soft); border-radius: 0 10px 10px 0; font-size: 14.5px; line-height: 1.45; color: var(--text); }
.src { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .02em; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); text-align: left; font-weight: 500; padding: 7px 10px; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); vertical-align: top; line-height: 1.4; }
.tbl td.k { color: var(--text); font-weight: 600; }
.tbl.tight td { padding: 6px 9px; font-size: 12.3px; }
code, .code { font-family: var(--mono); font-size: 11px; color: var(--lemon); background: rgba(244, 224, 77, .07); padding: 1px 5px; border-radius: 4px; word-break: break-word; }

/* reveal on enter */
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.slide.active .r { animation: up .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 70ms + 80ms); }

/* ============================================================
   SLIDE-SPECIFIC
   ============================================================ */
/* 1 title */
.s-title { padding: 0; }
.s-title .title-wrap { position: absolute; left: 76px; top: 120px; width: 700px; }
.s-title h1 { font-size: 96px; line-height: .96; font-weight: 700; letter-spacing: -0.04em; margin: 22px 0 26px; }
.s-title .sub { font-size: 19px; line-height: 1.5; color: var(--muted); max-width: 600px; }
.s-title .meta { margin-top: 34px; font-family: var(--mono); font-size: 12px; color: var(--faint); display: flex; gap: 22px; letter-spacing: .06em; text-transform: uppercase; }
.s-title .meta span:empty { display: none; }
.s-title .art { position: absolute; right: -150px; top: 50px; width: 640px; height: 640px; }

/* 2 summary */
.pcard .pnum { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--lemon); margin-bottom: 12px; }
.pcard h3 { font-size: 23px; margin-bottom: 2px; }
.pcard .uc { font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.pcard p { font-size: 14.5px; }

/* 5 prioritization */
.prio { display: grid; grid-template-columns: 300px 1fr; gap: 20px; flex: 1; min-height: 0; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { padding: 12px 14px; }
.step p { font-size: 12.8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.presets button { font-family: var(--mono); font-size: 10.5px; padding: 6px 10px; border-radius: 999px; background: transparent; color: var(--muted); border: 1px solid var(--line-2); cursor: pointer; }
.presets button.on { background: var(--lemon); color: var(--lemon-ink); border-color: var(--lemon); font-weight: 600; }
.ptbl td.num, .ptbl th.num { font-family: var(--mono); text-align: center; }
.ptbl th .w { display: block; color: var(--lemon); font-size: 10px; margin-top: 2px; }
.ptbl td .alias { display: block; font-family: var(--mono); font-size: 10px; color: var(--faint); font-weight: 400; margin-top: 2px; letter-spacing: .02em; }
.ptbl tr.top td { color: var(--text); }
.ptbl tr.top td:first-child { box-shadow: inset 3px 0 0 var(--lemon); }
.ptbl td.score { font-weight: 700; color: var(--lemon); font-size: 14px; }
.ptbl tr:not(.top) td.score { color: var(--muted); }

/* 6 map */
.map { display: grid; grid-template-columns: 1fr 300px; gap: 22px; flex: 1; min-height: 0; }
.map svg text { font-family: var(--display); }
.qd { display: flex; flex-direction: column; gap: 10px; }
.qd .card { padding: 12px 14px; }
.qd .card p { font-size: 12.8px; }

/* 7 flywheel */
.fly { display: grid; grid-template-columns: 500px 1fr; gap: 26px; flex: 1; min-height: 0; }
.fly .side { display: flex; flex-direction: column; gap: 10px; }
.fly .side .card { padding: 12px 16px; }

/* 8 roadmap */
.gantt { display: grid; grid-template-columns: 150px repeat(6, 1fr); row-gap: 8px; align-items: stretch; }
.gantt .mh { font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-align: center; padding: 4px 0 6px; border-bottom: 1px solid var(--line-2); letter-spacing: .06em; }
.gantt .lane { font-size: 13.5px; font-weight: 700; padding-right: 10px; display: flex; flex-direction: column; justify-content: center; }
.gantt .lane small { display: block; font-weight: 400; color: var(--faint); font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.bar { min-height: 56px; border-radius: 10px; padding: 7px 11px; font-size: 11.6px; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; margin: 0 3px; color: var(--muted); }
.bar b { font-size: 13px; color: inherit; }
.bar.pm { background: var(--lemon); color: var(--lemon-ink); }
.bar.pm b { color: var(--lemon-ink); }
.bar.pm.pre { background: rgba(244, 224, 77, .16); color: var(--text); border: 1px solid rgba(244, 224, 77, .4); }
.bar.pm.pre b { color: var(--text); }
.bar.da { background: var(--sky-soft); border: 1px solid rgba(124, 196, 255, .4); color: var(--text); }
.bar.cp { background: var(--orange-soft); border: 1px dashed rgba(255, 143, 77, .65); color: var(--text); min-height: 44px; }
.ms { font-size: 11.2px; color: var(--text); line-height: 1.3; margin: 0 3px; padding: 6px 8px; border-left: 2px solid var(--lemon); background: rgba(255, 255, 255, .02); }
.ms .d { font-family: var(--mono); color: var(--lemon); font-size: 10px; display: block; letter-spacing: .06em; }

/* 9 year 2 */
.y2 h3 { display: flex; justify-content: space-between; align-items: center; }
.y2 .sec { margin-top: 10px; }
.y2 .sec p { font-size: 13px; }

/* 10 mvp */
.mvp { display: grid; grid-template-columns: 1fr 470px; gap: 22px; flex: 1; min-height: 0; }
.flow { display: flex; flex-direction: column; gap: 7px; }
.flow .st { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; align-items: start; }
.flow .st i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--lemon-ink); background: var(--lemon); width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 600; }
.slack { background: #1a1d21; border: 1px solid #34383e; border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.45; }
.slack .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.slack .av { width: 34px; height: 34px; border-radius: 8px; background: var(--lemon); color: var(--lemon-ink); font-weight: 700; font-family: var(--mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.slack .nm { font-weight: 700; } .slack .app { font-size: 9px; font-family: var(--mono); background: #2f3338; color: #c9cbcf; padding: 1px 5px; border-radius: 4px; margin-left: 6px; }
.slack .tm { color: #8b8f95; font-size: 11px; margin-left: 6px; }
.slack .pk { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid #2c2f34; color: #d5d6d8; font-size: 12.3px; }
.slack .sc { font-family: var(--mono); font-weight: 600; color: var(--lemon); font-size: 13px; }
.slack .why { color: #9a9ea4; font-size: 11.6px; display: block; }
.slack .fl { color: var(--orange); font-size: 11.6px; }
.slack .btns { display: flex; gap: 8px; margin-top: 10px; }
.slack .btns span { font-size: 11.5px; border: 1px solid #4a4f56; border-radius: 6px; padding: 5px 10px; color: #e8e8e8; }
.slack .btns span.go { background: #2e7d5b; border-color: #2e7d5b; }

/* 11 architecture */
.arch { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
.arch .col { position: relative; }
.arch .col:not(:last-child)::after { content: '\2192'; position: absolute; right: -19px; top: 44%; color: var(--lemon); font-size: 18px; }
.arch .col .lab { margin-bottom: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-size: 12px; line-height: 1.35; color: var(--muted); margin-bottom: 7px; }
.chip b { color: var(--text); font-weight: 600; display: block; font-size: 12.5px; }
.chip.y { border-color: rgba(244, 224, 77, .5); background: rgba(244, 224, 77, .07); }
.chip.s { border-color: rgba(124, 196, 255, .45); background: var(--sky-soft); }
.loop { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 10px; padding: 8px 14px; }
.loop .arr { font-family: var(--mono); color: var(--lemon); }

/* 12 n8n */
.shot { height: 262px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #141512; position: relative; }
.shot img { width: 100%; height: 100%; object-fit: contain; display: block; background: #f5f5f5; }
.shot.has-img .fallback { display: none; }
.shot .fallback { width: 100%; height: 100%; }
.shot .fallback text { font-family: var(--display); }
.stages { display: grid; grid-template-columns: 1.15fr 1fr .85fr 1fr; gap: 12px; }
.stages .card { padding: 11px 13px; }
.stages .card p { font-size: 11.6px; line-height: 1.42; }
.stages code { font-size: 10px; }

/* 13 failures */
.fail { display: grid; grid-template-columns: 1fr 330px; gap: 18px; flex: 1; min-height: 0; }
.big { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; color: var(--lemon); line-height: 1; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv b { color: var(--text); font-family: var(--mono); font-weight: 500; font-size: 12px; white-space: nowrap; }

/* 14 build vs buy */
.bvb { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
.crit { display: grid; grid-template-columns: 1fr 120px 34px; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.crit .bar2 { height: 7px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.crit .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lemon); border-radius: 4px; }
.crit .pct { font-family: var(--mono); font-size: 11px; color: var(--text); text-align: right; }
.gate { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-bottom: 6px; }
.gate::before { content: 'GATE'; font-family: var(--mono); font-size: 9px; color: var(--orange); border: 1px solid rgba(255, 143, 77, .5); border-radius: 4px; padding: 1px 4px; margin-top: 2px; }
.path { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.path div { background: var(--panel-2); border: 1px solid var(--line); padding: 9px 12px 9px 22px; font-size: 12px; color: var(--muted); line-height: 1.35; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); }
.path div:first-child { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-left: 14px; }
.path div b { display: block; color: var(--text); font-size: 12.5px; }
.path div.now { background: rgba(244, 224, 77, .14); border-color: rgba(244, 224, 77, .4); }

/* 15 risks */
.risk .n { font-family: var(--mono); font-size: 30px; font-weight: 600; color: var(--orange); line-height: 1; margin-bottom: 8px; }
.risk h3 { font-size: 17.5px; min-height: 44px; }
.risk .sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 10px 0 5px; }
.risk p, .risk li { font-size: 12.6px; }

/* 16 rollout */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { font-size: 12.5px; border: 1px solid rgba(244, 224, 77, .4); background: rgba(244, 224, 77, .07); color: var(--text); padding: 6px 12px; border-radius: 999px; }
.tl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; position: relative; }
.tl .card { position: relative; padding-top: 22px; }
.tl .card::before { content: ''; position: absolute; top: -7px; left: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--lemon); box-shadow: 0 0 0 4px var(--bg); }
.tl::before { content: ''; position: absolute; top: -1px; left: 24px; right: 24px; height: 2px; background: linear-gradient(90deg, var(--lemon), rgba(244, 224, 77, .2)); }
.tl .when { font-family: var(--mono); font-size: 10.5px; color: var(--lemon); letter-spacing: .08em; text-transform: uppercase; }
.tl p { font-size: 12.8px; }

/* 17 HITL */
.hitl .card { padding: 15px 16px; }
.hitl h3 { display: flex; align-items: center; gap: 10px; }
.hitl h3 i { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--lemon); color: var(--lemon-ink); }
.hitl li { font-size: 12.7px; }

/* 18 metrics */
.mx { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.mx .card { padding: 18px 20px; }
.mx .name { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin: 2px 0 6px; }
.mx .def { font-size: 13.4px; color: var(--muted); line-height: 1.45; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.tile { border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 10px; }
.tile .v { font-size: 25px; font-weight: 700; color: var(--lemon); letter-spacing: -0.02em; }
.tile .l { font-family: var(--mono); font-size: 9.5px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.qs { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.qs div { font-size: 13px; color: var(--text); border-left: 2px solid var(--lemon); padding: 3px 10px; }
.kill { display: flex; gap: 12px; align-items: center; border: 1px dashed rgba(255, 143, 77, .6); background: var(--orange-soft); border-radius: 10px; padding: 10px 14px; font-size: 13.2px; color: var(--text); }
.kill b { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--orange); text-transform: uppercase; }

/* 19 close */
.ask { counter-reset: a; display: flex; flex-direction: column; gap: 8px; }
.ask div { counter-increment: a; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 13.6px; color: var(--muted); line-height: 1.4; }
.ask div::before { content: counter(a); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--lemon-ink); background: var(--lemon); border-radius: 7px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.ask div b { color: var(--text); }
.wk { display: grid; grid-template-columns: 70px 1fr; gap: 6px 12px; font-size: 13.2px; color: var(--muted); line-height: 1.4; }
.wk .d { font-family: var(--mono); font-size: 11px; color: var(--lemon); padding-top: 2px; }
.closing { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.closing span { color: var(--lemon); }

/* appendix */
.appx .kicker { color: var(--sky); }
.appx .kicker::before { background: var(--sky); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain span { font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; color: var(--muted); line-height: 1.3; }
.chain span b { color: var(--text); }
.chain em { font-style: normal; color: var(--lemon); font-family: var(--mono); font-size: 12px; }
.qa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.qa div { font-size: 12.6px; color: var(--muted); line-height: 1.42; }
.qa div b { display: block; color: var(--text); font-size: 13.2px; margin-bottom: 2px; }

/* roomy: larger type for slides that have vertical space to spare */
