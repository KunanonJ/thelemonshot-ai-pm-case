
</main>
<div class="progress" id="progress"></div>
<div class="hint" id="hint">&#8592; &#8594; navigate · N notes · F fullscreen</div>
<div class="notes-panel" id="notes-panel" aria-live="polite"></div>

<script>
/* ============================================================
   CONFIG: the only things you should need to edit
   ============================================================ */
const CONFIG = {
  presenter: '', // e.g. 'Your Name · AI Product Manager candidate' (hidden when empty)
  // Creator Match starting weights (appendix A5). Keep in sync with n8n/build.mjs (Rank + hard rules).
  weights: {
    Sales:      { perf: 35, audience: 25, brand: 20, cost: 20, why: 'proven conversion matters most; brand fit stays a safety lever.' },
    Awareness:  { perf: 20, audience: 35, brand: 25, cost: 20, why: 'reaching the right people comes first; history matters less at the top of the funnel.' },
    Engagement: { perf: 25, audience: 25, brand: 30, cost: 20, why: 'community briefs live or die on tone and authenticity.' },
  },
};

/* ============================================================
   PRESENTATION CONTROLLER
   ============================================================ */
class Deck {
  constructor() {
    this.slides = [...document.querySelectorAll('.slide')];
    this.i = 0;
    this.progress = document.getElementById('progress');
    this.notes = document.getElementById('notes-panel');
    this.addFooters();
    this.fit();
    addEventListener('resize', () => this.fit());
    this.bindInput();
    const start = parseInt(location.hash.replace('#', ''), 10);
    this.show(Number.isFinite(start) ? start - 1 : 0);
    setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 4500);
  }
  addFooters() {
    const total = this.slides.length;
    this.slides.forEach((s, k) => {
      if (s.classList.contains('no-foot')) return;
      const f = document.createElement('div');
      f.className = 'foot';
      f.innerHTML = `<span>The Lemon Shot · AI Product Manager case</span><span>${s.dataset.section || ''}</span><span>${String(k + 1).padStart(2, '0')} / ${total}</span>`;
      s.appendChild(f);
    });
  }
  fit() {
    const scale = Math.min(innerWidth / 1280, innerHeight / 720);
    document.documentElement.style.setProperty('--scale', scale);
  }
  show(n) {
    this.i = Math.max(0, Math.min(this.slides.length - 1, n));
    this.slides.forEach((s, k) => s.classList.toggle('active', k === this.i));
    this.progress.style.width = ((this.i + 1) / this.slides.length * 100) + '%';
    history.replaceState(null, '', '#' + (this.i + 1));
    const note = this.slides[this.i].querySelector('.notes');
    this.notes.innerHTML = `<span class="h">NOTES · ${this.i + 1} / ${this.slides.length}</span>` + (note ? note.innerHTML : 'No notes for this slide.');
  }
  bindInput() {
    addEventListener('keydown', e => {
      const k = e.key;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(k)) { e.preventDefault(); this.show(this.i + 1); }
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(k)) { e.preventDefault(); this.show(this.i - 1); }
      else if (k === 'Home') this.show(0);
      else if (k === 'End') this.show(this.slides.length - 1);
      else if (k === 'n' || k === 'N') this.notes.classList.toggle('on');
      else if (k === 'f' || k === 'F') {
        if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
      }
    });
    let last = 0;
    addEventListener('wheel', e => {
      const now = Date.now();
      if (now - last < 650 || Math.abs(e.deltaY) < 24) return;
      last = now;
      this.show(this.i + (e.deltaY > 0 ? 1 : -1));
    }, { passive: true });
    let x0 = null;
    addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) this.show(this.i + (dx < 0 ? 1 : -1));
      x0 = null;
    });
  }
}

/* ============================================================
   SLIDE 5: live weight stress-test
   ============================================================ */
const USE_CASES = [
  { name: 'Campaign Proposal', alias: 'Proposal Copilot', s: [4, 5, 3, 5, 4], gate: true },
  { name: 'Creator Selection Matrix', alias: 'Creator Match', s: [4, 4, 5, 3, 4], gate: true },
  { name: 'Campaign Optimization', alias: 'Campaign Pulse', s: [4, 3, 4, 3, 3], gate: true },
  { name: 'Creator RMN', alias: 'build on Phase 1 data', s: [5, 1, 5, 1, 2], gate: false },
  { name: 'Trend Monitoring', alias: 'buy, not build', s: [2, 3, 2, 4, 4], gate: true },
  { name: 'DCO', alias: 'after likeness governance', s: [3, 2, 2, 2, 1], gate: false },
];
const PRESETS = {
  'Base': [30, 25, 20, 15, 10],
  'Impact-heavy': [40, 20, 20, 10, 10],
  'Moat-heavy': [25, 20, 35, 10, 10],
  'Speed-heavy': [25, 30, 10, 25, 10],
};
function renderPriorities(preset) {
  const w = PRESETS[preset];
  document.querySelectorAll('[data-w]').forEach((el, k) => { el.textContent = w[k] + '%'; });
  const rows = USE_CASES
    .map(u => ({ ...u, score: u.s.reduce((sum, v, k) => sum + v * w[k] / 100, 0) }))
    .sort((a, b) => b.score - a.score);
  document.getElementById('prio-body').innerHTML = rows.map((r, k) => `
    <tr class="${k < 3 ? 'top' : ''}">
      <td class="k">${r.name}<span class="alias">${r.alias}</span></td>
      ${r.s.map(v => `<td class="num">${v}</td>`).join('')}
      <td class="num score">${r.score.toFixed(2)}</td>
      <td>${k < 3 ? '<span class="tag y">Phase 1</span>' : '<span class="tag">Year 2</span>'}${r.gate ? '' : ' <span class="tag o">fails gate</span>'}</td>
    </tr>`).join('');
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.preset === preset));
}
document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', e => {
  renderPriorities(b.dataset.preset);
  e.currentTarget.blur();
}));
renderPriorities('Base');

/* ============================================================
   SLIDE 6: value vs feasibility map
   ============================================================ */
(function drawMap() {
  const svg = document.getElementById('map');
  const NS = 'http://www.w3.org/2000/svg';
  const W = 820, H = 470, M = { l: 58, r: 16, t: 14, b: 50 };
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const sx = v => M.l + (v - 0.5) / 5 * pw;
  const sy = v => M.t + ph - (v - 1) / 4.5 * ph;
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  };
  const C = { grid: '#2b2f23', muted: '#b0b3a3', faint: '#73776a', text: '#f3f1e7', lemon: '#f4e04d', bg: '#0e0f0b' };
  for (let v = 1; v <= 5; v++) {
    el('line', { x1: sx(v), x2: sx(v), y1: M.t, y2: M.t + ph, stroke: C.grid });
    el('text', { x: sx(v), y: M.t + ph + 18, fill: C.faint, 'font-size': 11, 'text-anchor': 'middle' }, v);
  }
  for (let v = 2; v <= 5; v++) {
    el('line', { x1: M.l, x2: M.l + pw, y1: sy(v), y2: sy(v), stroke: C.grid });
    el('text', { x: M.l - 10, y: sy(v) + 4, fill: C.faint, 'font-size': 11, 'text-anchor': 'end' }, v);
  }
  el('line', { x1: sx(2.5), x2: sx(2.5), y1: M.t, y2: M.t + ph, stroke: C.faint, 'stroke-width': 1.5, 'stroke-dasharray': '5 5' });
  el('line', { x1: M.l, x2: M.l + pw, y1: sy(3), y2: sy(3), stroke: C.faint, 'stroke-width': 1.5, 'stroke-dasharray': '5 5' });
  el('text', { x: sx(2.5) + 7, y: M.t + 16, fill: C.muted, 'font-size': 11.5, 'font-style': 'italic' }, 'Phase 1 feasibility gate');
  const quad = (x, y, anchor, t) => el('text', { x, y, fill: C.faint, 'font-size': 10.5, 'font-weight': 600, 'letter-spacing': 1, 'text-anchor': anchor, 'font-family': 'JetBrains Mono, monospace' }, t);
  quad(W - M.r - 6, M.t + 16, 'end', 'BUILD NOW');
  quad(M.l + 8, sy(3) - 9, 'start', 'BUILD ON PHASE 1 DATA');
  quad(W - M.r - 6, M.t + ph - 9, 'end', "BUY, DON'T BUILD");
  quad(M.l + 8, M.t + ph - 9, 'start', 'AFTER GOVERNANCE');
  el('text', { x: M.l + pw / 2, y: H - 8, fill: C.muted, 'font-size': 11.5, 'text-anchor': 'middle' }, 'Feasibility under Phase 1 constraints (1 = needs engineers, 5 = low-code ready)');
  el('text', { x: 15, y: M.t + ph / 2, fill: C.muted, 'font-size': 11.5, 'text-anchor': 'middle', transform: `rotate(-90 15 ${M.t + ph / 2})` }, 'Strategic value (average of impact and moat)');
  const pts = [
    { n: 'Proposal Copilot', f: 5, v: 3.5, sc: '4.20', p1: true, dx: -15, a: 'end' },
    { n: 'Creator Match', f: 4, v: 4.5, sc: '4.05', p1: true, dx: 15, a: 'start' },
    { n: 'Campaign Pulse', f: 3, v: 4.0, sc: '3.50', p1: true, dx: 15, a: 'start' },
    { n: 'Creator RMN', f: 1, v: 5.0, sc: '3.10', p1: false, dx: 15, a: 'start' },
    { n: 'Trend Monitoring', f: 3, v: 2.0, sc: '2.75', p1: false, dx: 15, a: 'start' },
    { n: 'DCO', f: 2, v: 2.5, sc: '2.20', p1: false, dx: -15, a: 'end' },
  ];
  pts.forEach(p => {
    const x = sx(p.f), y = sy(p.v);
    if (p.p1) el('circle', { cx: x, cy: y, r: 9, fill: C.lemon, stroke: C.bg, 'stroke-width': 2 });
    else el('circle', { cx: x, cy: y, r: 8, fill: C.bg, stroke: C.muted, 'stroke-width': 2 });
    el('text', { x: x + p.dx, y: y + 4, fill: C.text, 'font-size': 14, 'font-weight': 700, 'text-anchor': p.a }, p.n);
    el('text', { x: x + p.dx, y: y + 20, fill: C.faint, 'font-size': 11.5, 'text-anchor': p.a, 'font-family': 'JetBrains Mono, monospace' }, 'score ' + p.sc);
  });
})();

/* ============================================================
   APPENDIX A5: weights table + presenter name
   ============================================================ */
(function renderWeights() {
  const tb = document.querySelector('#weights tbody');
  if (!tb) return;
  tb.innerHTML = Object.entries(CONFIG.weights).map(([obj, w]) =>
    `<tr><td class="k">${obj}</td><td class="num">${w.perf}</td><td class="num">${w.audience}</td><td class="num">${w.brand}</td><td class="num">${w.cost}</td></tr>`).join('');
  document.getElementById('weights-why').innerHTML = Object.entries(CONFIG.weights)
    .map(([obj, w]) => `<b>${obj}:</b> ${w.why}`).join(' ');
})();
document.querySelectorAll('[data-presenter]').forEach(e => { e.textContent = CONFIG.presenter; });

new Deck();
</script>
</body>
</html>
